[package]
name = "wgather"
version = "0.1.0"
edition = "2021"

[dependencies]
config = { path = "../../config" }
types = { path = "../../types" }
crypto = { path = "../../crypto" }
util = { path = "../../util" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
