name: replica
version: "1.0"
author: hermitsage <dth.bht@gmail.com>
about: Distributed protocol node and local weighted test runner
args:
    - config:
        short: c
        long: config
        help: the config file containing startup information
        takes_value: true
        required: true
    - debug:
        short: v
        multiple: true
        help: sets the verbosity level
    - ip:
        short: i
        long: ip
        help: A file containing all the ips for the other servers
        takes_value: true
    - protocol:
        short: p
        long: protocol
        help: Protocol to run; weighted entries execute one local test node per process
        takes_value: true
        required: true
        possible_values: [ctrbc, wra, wavid, wrbc, wgather, wbinaa]
    
    - syncer:
        short: y
        long: syncer
        help: IPs for the syncer to connect to
        takes_value: true
    - batches:
        short: t
        long: batches
        help: Number of batches to split secrets
        takes_value: true
    - per:
        short: r
        long: per
        help: Number of secrets to pack into each batch
        takes_value: true
    # - bfile:
    #     short: b
    #     long: bfile
    #     help: The location of a file containing the list of all messages to be reliably broadcasted
    #     takes_value: true
    - lin:
        short: l
        long: lin
        help: Linear public reconstruction
        takes_value: true
    
    - opt:
        short: o
        long: opt
        help: Optimistic or pessimistic
        takes_value: true

    - ibft:
        short: f
        long: ibft
        help: Istanbul BFT
        takes_value: true
    - test_absent:
        long: test-absent
        help: Comma-separated absent node IDs for the weighted test; total absent weight must be below T
        takes_value: true
        default_value: ""
    - test_result:
        long: test-result
        help: Publish this node's weighted test result atomically as JSON; continue serving until SIGTERM or Ctrl-C
        takes_value: true
    - test_timeout:
        long: test-timeout
        help: Weighted test deadline in seconds before local output; not a protocol decision
        takes_value: true
        default_value: "30"
    - test_bits:
        long: test-bits
        help: BinAA test precision is 2^(-bits)
        takes_value: true
        default_value: "8"
    - test_payload_bytes:
        long: test-payload-bytes
        help: Deterministic WAVID and WRBC test file size in bytes
        takes_value: true
        default_value: "65536"
    - test_block_bytes:
        long: test-block-bytes
        help: Public WAVID/WRBC source block bytes; even 32..4096, must agree at every node
        takes_value: true
        default_value: "32"
